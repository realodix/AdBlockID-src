cache_dir: .tmp
fixer:
  paths:
    - src
    - tests
  excludes:
    - modules/_reference.txt
  flags:
    fmode: true


linter:
  rules:
    fmode: true
  paths:
    - src
  excludes:
    - modules/_reference.txt
    - addons/ubl_badware.txt
    - addons/ubl_gambling.txt
    - addons/ubl_porn_id.txt
    - addons/ubl_porn_int.txt


builder:
  output_dir: dist
  filter_list:
    - filename: adblockid.adfl.txt
      header: |
        [Adblock Plus 2.0]
        ! Title: AdBlockID
        ! Description: Filter list that specifically removes adverts on Indonesian language websites.
        ! Last modified: %timestamp%
        ! Expires: 1 days
        ! Homepage: https://github.com/realodix/AdBlockID
        ! License: https://github.com/realodix/AdBlockID/blob/main/LICENSE
      source:
        - src/general-block.adfl
        - src/general-hide.adfl
        - src/general-group.adfl
        - src/specific-block.adfl
        - src/specific-hide.adfl
        - src/specific-hide_2.adfl
        - src/anti-adblock.adfl
        - src/whitelist.adfl
        - src/extended.adfl
        - src/modules/fandom.adfl
        - src/modules/safelink.adfl
        - src/modules/adult.adfl
        - src/modules/adult-block.adfl
        - src/modules/adult-hide.adfl
        - src/modules/neighbor-country.adfl
    - filename: adblockid_plus.adfl.txt
      header: |
        [Adblock Plus 2.0]
        ! Title: AdBlockID Plus
        ! Description: Ekstensi untuk menambah cakupan situs yang tidak dapat dijangkau oleh AdBlockID.
        ! Last modified: %timestamp%
        ! Expires: 6 days
        ! Homepage: https://github.com/realodix/AdBlockID
        ! License: https://github.com/realodix/AdBlockID/blob/main/LICENSE
      source:
        - src/addons/plus/p_general.adfl
        - src/addons/plus/p_int.adfl
        - src/addons/plus/p_badware.adfl
    - filename: annoyance.txt
      header: |
        [Adblock Plus 2.0]
        ! Title: AdBlockID - Annoyances
        ! Description: Remove Pop-Ups, cookie warnings and other annoyances.
        ! Last modified: %timestamp%
        ! Expires: 6 days
        ! Homepage: https://github.com/realodix/AdBlockID
        ! License: https://github.com/realodix/AdBlockID/blob/main/LICENSE
      source:
        - src/addons/annoyances/any_general.adfl
        - src/addons/annoyances/any_limitation.adfl
        - src/addons/annoyances/any_popup.adfl
        - src/addons/annoyances/any_safelink.adfl
        - src/addons/annoyances/any_fandom_limitation.adfl
    - filename: safesearch.txt
      header: |
        ---
        name: AdBlockID Addons (Safesearch)
        description: A filter that blocks spam, misleading, and malicious websites from appearing in search results!
        homepage: https://github.com/realodix/AdBlockID
        ---
      source:
        - src/addons/ubl_badware.txt
    - filename: safesearch_plus.txt
      header: |
        ---
        name: AdBlockID Addons (Safesearch Plus)
        homepage: https://github.com/realodix/AdBlockID
        ---
      source:
        - src/addons/ubl_badware.txt
        - src/addons/ubl_porn_int.txt
        - src/addons/ubl_porn_id.txt
        - src/addons/ubl_gambling.txt
