name: Lint

on:
  pull_request:
    paths:
      - 'src/**'
  push:
    paths:
      - 'src/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
      - name: Lint
        run: |
          vendor/bin/haiku lint
